[tool.ruff]
# Set the maximum line length to 88 (standard for Black-compatible formatting)
line-length = 88

# Match the project runtime documented in README.md.
target-version = "py311"

[tool.ruff.lint]
# Select which rule sets to apply
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (automatically sorts your imports)
]

# Ignore specific rules if they are too annoying
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "PyPokerEngine",
    ".git",
    ".venv",
    "venv",
    "__pycache__"
]
pythonpath = [
    ".",
    "PyPokerEngine"
]
addopts = "-v"